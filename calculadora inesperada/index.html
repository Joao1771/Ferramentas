<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>
            Calculadora
        </title>
        <link rel="stylesheet" href="style.css">        
    </head>
    <body>
        <header>
            <h1>Calculadora</h1>
        </header>

        <section>
            <div id="calculadora">
                <div>
                    <textarea name="tela" id="tela" disabled></textarea>
                </div>
                <div id="botoes">
                    <table>
                        <tr>
                            <td><button onclick="verificar(this.innerText)" class="numero">7</button></td>
                            <td><button onclick="verificar(this.innerText)" class="numero">8</button></td>
                            <td><button onclick="verificar(this.innerText)" class="numero">9</button></td>
                            <td><button onclick="verificar(this.innerText)" class="operador">/</button></td>
                        </tr>
                        <tr>
                            <td><button onclick="verificar(this.innerText)" class="numero">4</button></td>
                            <td><button onclick="verificar(this.innerText)" class="numero">5</button></td>
                            <td><button onclick="verificar(this.innerText)" class="numero">6</button></td>
                            <td><button onclick="verificar(this.innerText)" class="operador">x</button></td>
                        </tr>
                        <tr>
                            <td><button onclick="verificar(this.innerText)" class="numero">1</button></td>
                            <td><button onclick="verificar(this.innerText)" class="numero">2</button></td>
                            <td><button onclick="verificar(this.innerText)" class="numero">3</button></td>
                            <td><button onclick="verificar(this.innerText)" class="operador">-</button></td>
                        </tr>
                        <tr>
                            <td><button onclick="verificar(this.innerText)" class="operador">C</button></td>
                            <td><button onclick="verificar(this.innerText)" class="numero">0</button></td>
                            <td><button onclick="verificar(this.innerText)" class="virgula">+</button></td>
                            <td><button onclick="verificar(this.innerText)" class="igual">=</button></td>
                        </tr>
                    </table>
                </div>
            </div>
            
        </section>

        <script src="script.js"></script>
    </body>
</html>
